<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-2: #1d4ed8;
      --border: #e5e7eb;
      --shadow: 0 18px 50px rgba(31, 41, 55, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #fff7ed 0, var(--bg) 45%, #e5e7eb 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(100%, 520px);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
    }

    .form {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .add-btn {
      background: var(--accent);
      color: white;
      font-weight: 700;
    }

    .add-btn:hover {
      background: var(--accent-2);
    }

    .list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
    }

    .item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      margin: 0;
      flex: 0 0 auto;
    }

    .text {
      flex: 1;
      word-break: break-word;
    }

    .done .text {
      color: var(--muted);
      text-decoration: line-through;
    }

    .delete-btn {
      background: #fee2e2;
      color: #991b1b;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .delete-btn:hover {
      background: #fecaca;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 22px 0 6px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .clear-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 10px 14px;
    }

    .clear-btn:hover {
      background: #f9fafb;
    }

    @media (max-width: 520px) {
      .app {
        padding: 20px;
      }

      .form {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .footer {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>To-Do List</h1>
    <p>Simple tasks saved in your browser.</p>

    <form id="todoForm" class="form">
      <input id="todoInput" type="text" placeholder="Add a new task..." autocomplete="off" />
      <button class="add-btn" type="submit">Add</button>
    </form>

    <ul id="todoList" class="list"></ul>
    <div id="emptyState" class="empty">No tasks yet. Add one above.</div>

    <div class="footer">
      <span id="taskCount">0 tasks</span>
      <button id="clearAllBtn" class="clear-btn" type="button">Clear All</button>
    </div>
  </main>

  <script>
    const todoForm = document.getElementById('todoForm');
    const todoInput = document.getElementById('todoInput');
    const todoList = document.getElementById('todoList');
    const emptyState = document.getElementById('emptyState');
    const taskCount = document.getElementById('taskCount');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const STORAGE_KEY = 'simple-todo-list';

    let todos = loadTodos();

    function loadTodos() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function renderTodos() {
      todoList.innerHTML = '';

      todos.forEach((todo) => {
        const li = document.createElement('li');
        li.className = `item ${todo.done ? 'done' : ''}`;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.addEventListener('change', () => {
          todo.done = checkbox.checked;
          saveTodos();
          renderTodos();
        });

        const text = document.createElement('span');
        text.className = 'text';
        text.textContent = todo.text;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.type = 'button';
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', () => {
          todos = todos.filter((item) => item.id !== todo.id);
          saveTodos();
          renderTodos();
        });

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(deleteBtn);
        todoList.appendChild(li);
      });

      emptyState.style.display = todos.length === 0 ? 'block' : 'none';
      taskCount.textContent = `${todos.length} task${todos.length === 1 ? '' : 's'}`;
    }

    todoForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = todoInput.value.trim();

      if (!text) {
        return;
      }

      todos.unshift({
        id: Date.now(),
        text,
        done: false,
      });

      todoInput.value = '';
      saveTodos();
      renderTodos();
      todoInput.focus();
    });

    clearAllBtn.addEventListener('click', () => {
      todos = [];
      saveTodos();
      renderTodos();
    });

    renderTodos();
  </script>
</body>
</html>
